
name: Daily Youtube Shorts Runner

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip setuptools wheel
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install --upgrade "numpy>=2.0" pyarrow
      - name: YouTube Secrets se file banao
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secret.json
          ls -lh token.json client_secret.json
    
      - name: Run automation
        run: |
          venv/bin/python automation.py
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/final_automation_video.mp4
