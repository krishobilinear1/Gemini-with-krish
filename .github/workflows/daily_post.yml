name: Daily YouTube Shorts Runner

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install moviepy
          python automation.py
          pip install htts
